name: android-build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["android-v*"]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"

jobs:
  build:
    name: APK (assembleRelease + unit tests)
    runs-on: ubuntu-latest
    permissions:
      contents: write   # публикация APK в Releases по тегу
    steps:
      - uses: actions/checkout@v5

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # SDK на ubuntu-раннерах уже предустановлен (ANDROID_HOME задан,
      # лицензии приняты) — недостающие platform/build-tools AGP скачает сам.

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Tests + APK
        working-directory: android
        run: gradle --no-daemon :app:testReleaseUnitTest :app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sc-remote-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Release (по тегу android-v*)
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
