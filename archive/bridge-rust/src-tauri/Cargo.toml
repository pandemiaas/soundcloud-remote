[package]
name = "soundcloud-remote-bridge"
version = "0.2.0"
description = "SoundCloud Remote — ПК-мост: WebSocket-сервер между Chrome-расширением и телефоном"
authors = ["pandemias"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "soundcloud_remote_bridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
rand = "0.8"
qrcode = "0.14"
log = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Media_Audio",
    "Win32_System_Com",
] }

[profile.release]
strip = true
lto = true
codegen-units = 1
